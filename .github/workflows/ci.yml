name: CelebrAI CI / Continuous Integration

on:
  push:
    branches: [main, quality-pass]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Test, Typecheck & Build
    runs-on: ubuntu-latest

    env:
      VITE_FIREBASE_API_KEY: mock-ci-api-key-for-testing-only
      VITE_FIREBASE_AUTH_DOMAIN: celebrai-62487.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: celebrai-62487
      VITE_FIREBASE_STORAGE_BUCKET: celebrai-62487.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "1009537060981"
      VITE_FIREBASE_APP_ID: "1:1009537060981:web:e81878149e5c07f010683c"
      VITE_FIREBASE_MEASUREMENT_ID: G-NVETMW4QHP

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Oxlint Static Code Analysis
        run: npm run lint

      - name: TypeScript Typecheck
        run: npx tsc -b

      - name: Run Vitest Test Suite
        run: npm test

      - name: Production Vite Build
        run: npm run build
        env:
          NODE_ENV: production
