name: CelebrAI CI / Continuous Integration

on:
  push:
    branches: [main, quality-pass]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Test, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Oxlint Static Code Analysis
        run: npm run lint

      - name: TypeScript Typecheck
        run: npx tsc -b

      - name: Run Vitest Test Suite
        run: npm test

      - name: Production Vite Build
        run: npm run build
        env:
          NODE_ENV: production
